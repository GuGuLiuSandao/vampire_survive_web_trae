<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔兽生存</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-container">
            <!-- 顶部横条 - 血量和经验 -->
            <div class="top-bar">
                <div class="health-bar-large">
                    <div class="health-label">生命值: <span id="health-value">100</span></div>
                    <div class="health-fill" id="health-fill"></div>
                </div>
                <div class="exp-bar-large">
                    <div class="exp-label">经验值: <span id="exp-value">0</span> / <span id="exp-required">100</span></div>
                    <div class="exp-fill" id="exp-fill"></div>
                </div>
            </div>
            
            <!-- 底部左侧信息面板 -->
            <div class="bottom-left-panel">
                <div class="level-info">等级: <span id="level-value">1</span></div>
                <div class="score-info">得分: <span id="score-value">0</span></div>
                <div class="fps-info">FPS: <span id="fps-value">0</span></div>
                <div class="skills-panel">
                    <!-- 技能等级信息将通过JavaScript动态添加 -->
                </div>
            </div>
            
            <!-- 传说技能按钮 -->
            <div id="legendary-skill-btn" class="legendary-skill-btn hidden">
                <div class="skill-icon">
                    <div class="skill-name">艾露恩之怒</div>
                    <div class="skill-cooldown" id="skill-cooldown">60s</div>
                </div>
                <div class="skill-cooldown-overlay" id="skill-cooldown-overlay"></div>
            </div>
            <div id="level-up-panel" class="level-up-panel hidden">
                <h2>升级!</h2>
                <div class="level-up-options">
                    <!-- 技能选项将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
        <div id="game-over-panel" class="game-over-panel hidden">
            <h1>游戏结束</h1>
            <div class="final-score">最终得分: <span id="final-score">0</span></div>
            <div class="survival-time">生存时间: <span id="survival-time">0</span></div>
            <button id="restart-btn">重新开始</button>
        </div>
        <div id="start-menu" class="start-menu">
            <h1 class="game-title">魔兽生存</h1>
            <div class="menu-content">
                <div class="class-selection">
                    <h2>选择职业</h2>
                    <div class="class-buttons">
                        <button class="class-btn active" data-class="druid">德鲁伊</button>
                        <!-- 其他职业将在后续版本中添加 -->
                        <!-- <button class="class-btn" data-class="warrior">战士</button>
                        <button class="class-btn" data-class="mage">法师</button>
                        <button class="class-btn" data-class="hunter">猎人</button> -->
                    </div>
                </div>
                <div class="difficulty-selection">
                    <h2>选择难度</h2>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn active" data-difficulty="easy">简单</button>
                        <button class="difficulty-btn" data-difficulty="normal">普通</button>
                        <button class="difficulty-btn" data-difficulty="hard">困难</button>
                    </div>
                </div>
                <div class="start-button-container">
                    <button id="start-game-btn" class="start-btn">开始游戏</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
